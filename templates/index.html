{% block content %}
 <img src="/random/chart" alt = "bargraph">

<form action="/check" method="POST"></form>
    <label for="name">Submit guess</label>
     <style>
      /* small layout nicety */
      .page-container { padding: 2rem; max-width: 720px; margin: 0 auto; }
      .spinner-inline { width: 1rem; height: 1rem; vertical-align: text-bottom; margin-left: .5rem; }

     
      

      /* the custom box that appears next to the label text */
      .option-box {
        display: inline-block;
        width: 1.25rem;
        height: 1.25rem;
        border: 2px solid #cbd5e1; /* soft gray */
        border-radius: 6px;
        background: white;
        box-sizing: border-box;
        position: relative;
        transition: border-color .12s ease, background-color .12s ease, box-shadow .12s ease;
      }

    

      /* checkmark (white) shown when checked */
      .option-box::after {
        content: "";
        position: absolute;
        left: 6px;
        top: 2px;
        width: 6px;
        height: 10px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
        opacity: 0;
        transition: opacity .12s ease;
      }


    </style>
  
 
    <h1>PokeGuesser</h1>

    <form id="itemForm" method="post" novalidate>
      <div class="mb-3">
        <label class="form-label">Name</label>
        <div class="input-group">
          <input id="name" name="name" type="text" class="form-control" placeholder="Name" required autocomplete="off">
          <span id="nameSpinner" class="input-group-text bg-white border-start-0" style="display:none;">
            <div class="spinner-border spinner-border-sm spinner-inline" role="status" aria-hidden="true"></div>
          </span>
        </div>
      </div>

     <!-- Insert this below the name input group inside the form -->
<div id="guessResult" class="d-flex align-items-start mt-3" style="display:none;">
  <div id="spriteBox" class="me-3">
    <img id="pokeSprite" src="" alt="" />
  </div>
  <div id="infoBoxes" class="d-flex flex-wrap gap-2" role="list" aria-label="Guess feedback">
    <!-- Boxes will be injected here by JS -->
  </div>
</div>

<style>
  /* Sprite box */
  #spriteBox {
    width: 96px;
    height: 96px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
  }
  #spriteBox img {
    max-width:100%;
    max-height:100%;
    display:block;
  }

  /* Info boxes container */
  #infoBoxes {
    flex:1;
    display:flex;
    gap:8px;
    align-items:stretch;
    flex-wrap:nowrap;
    overflow:auto;
  }

  /* Each info box */
  .info-box {
    min-width:120px;
    height:96px;
    padding:8px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    background:#fff;
    border-radius:6px;
    text-transform:none;
  }

  /* First box (sprite label) has no outline */
  .info-box.first {
    border:0;
    box-shadow:none;
  }

  /* Other boxes have thin black outline */
  .info-box.outlined {
    border:1px solid #000;
  }

  .info-box .label {
    font-size:12px;
    color:#333;
    margin-bottom:6px;
    font-weight:600;
  }

  .info-box .value {
    font-size:16px;
    color:#111;
    font-weight:700;
  }

  /* Color states for type/gen match */
  .match-true { background:#d4f7d4; } /* greenish */
  .match-false { background:#f7d4d4; } /* reddish */

  /* Generation arrow */
  .gen-arrow {
    font-size:18px;
    margin-left:6px;
    opacity:0.9;
  }

  /* Make horizontal scroll visible on small screens */
  #infoBoxes::-webkit-scrollbar { height:8px; }
  #infoBoxes::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius:4px; }
</style>

      <div class="mb-3">
        <button id="submitBtn" type="submit" class="btn btn-primary" disabled>Submit Guess</button>
      </div>

      <div id="formMessages" aria-live="polite"></div>
    </form>

    <script>
(function () {
  const nameInput = document.getElementById('name');
  const submitBtn = document.getElementById('submitBtn');
  const messages = document.getElementById('formMessages');
  const nameSpinner = document.getElementById('nameSpinner');

  // --- NEW: suggestions container and cached names ---
  const suggestionsBox = document.createElement('div');
  suggestionsBox.id = 'nameSuggestions';
  suggestionsBox.style.position = 'absolute';
  suggestionsBox.style.zIndex = '1000';
  suggestionsBox.style.background = '#fff';
  suggestionsBox.style.border = '1px solid rgba(0,0,0,0.15)';
  // remove top border and flatten top corners so there is no visible gap
  suggestionsBox.style.borderTop = '0';
  suggestionsBox.style.borderRadius = '0 0 4px 4px';
  suggestionsBox.style.boxShadow = '0 4px 8px rgba(0,0,0,0.06)';
  suggestionsBox.style.maxHeight = '240px';
  suggestionsBox.style.overflow = 'auto';
  suggestionsBox.style.display = 'none';
  suggestionsBox.style.boxSizing = 'border-box';
  suggestionsBox.setAttribute('role', 'listbox');
  suggestionsBox.setAttribute('aria-label', 'Pokémon suggestions');
  // append to body so absolute positioning uses viewport coordinates reliably
  document.body.appendChild(suggestionsBox);

  // helper to position suggestions exactly under the input with no gap
  function positionSuggestions() {
    const rect = nameInput.getBoundingClientRect();
    suggestionsBox.style.width = rect.width + 'px';
    suggestionsBox.style.left = rect.left + window.scrollX + 'px';
    // place top exactly at the input bottom; borderTop is removed so no visible gap
    suggestionsBox.style.top = rect.bottom + window.scrollY + 'px';
  }
  // state
  let pokemonExists = false;
  let checking = false;
  let debounceTimer = null;
  let cachedNames = null;
  let loadingNames = false;
  const DEBOUNCE_MS = 1000; // wait 1 second after typing stops

  // helper: show message(s)
  function setMessage(text, kind = 'danger') {
    if (!text) {
      messages.innerHTML = '';
      return;
    }
    messages.innerHTML = `<div class="alert alert-${kind} py-2">${escapeHtml(text)}</div>`;
  }

  // escape to avoid injection if user types weird characters
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // show/hide spinner
  function showSpinner(show) {
    nameSpinner.style.display = show ? '' : 'none';
  }

  // validate required fields (except type2)
  function requiredFieldsFilled() {
    return nameInput.value.trim() !== '' ;
  }

  // update submit button enabled/disabled based on state
  function updateSubmitState() {
    // disable while checking
    if (checking) {
      submitBtn.disabled = true;
      return;
    }

    // required fields must be filled and pokemon must exist
    if (!requiredFieldsFilled()) {
      submitBtn.disabled = true;
      const missing = [];
      if (nameInput.value.trim() === '') missing.push('Name');
    
      return;
    }

    // if name is filled but we haven't confirmed existence yet
    if (!pokemonExists) {
      submitBtn.disabled = true;
      
      return;
    }

    // all good
    submitBtn.disabled = false;
  
  }

  // check pokemon existence via PokeAPI and autofill types when found
  async function checkPokemon(name) {
    const normalized = name.trim().toLowerCase();
    if (!normalized) {
      pokemonExists = false;
      checking = false;
      showSpinner(false);

      updateSubmitState();
      return;
    }

    checking = true;
    pokemonExists = false;
    showSpinner(true);
   

    try {
      const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(normalized)}`, { method: 'GET' });

      if (res.ok) {
        // found — parse types and autofill
        const data = await res.json();
        const types = (data.types || [])
          .slice() // copy
          .sort((a, b) => a.slot - b.slot)
          .map(t => t.type && t.type.name ? t.type.name : '');

         const detectedTypes = [types[0] || '', types[1] || ''];

        pokemonExists = true;
        checking = false;
        showSpinner(false);
        updateSubmitState();
      } else if (res.status === 404) {
        pokemonExists = false;
        checking = false;
        showSpinner(false);
        updateSubmitState();
      } else {
        // other server error
        pokemonExists = false;
        checking = false;
        showSpinner(false);


        updateSubmitState();
      }
    } catch (err) {
      // network error
      pokemonExists = false;
      checking = false;
      showSpinner(false);
      
      updateSubmitState();
    }
  }

  // --- NEW: load all pokemon names once and cache them ---
  async function loadAllPokemonNames() {
    if (cachedNames || loadingNames) return;
    loadingNames = true;
    try {
      // fetch a large list once; PokeAPI supports large limit
      const res = await fetch('https://pokeapi.co/api/v2/pokemon?limit=100000');
      if (!res.ok) {
        loadingNames = false;
        return;
      }
      const json = await res.json();
      cachedNames = (json.results || []).map(r => String(r.name).toLowerCase());
    } catch (e) {
      // ignore failures; suggestions will simply not appear
      cachedNames = null;
    } finally {
      loadingNames = false;
    }
  }

  // --- NEW: show suggestions filtered from cachedNames ---
  function showSuggestionsFor(value) {
    const q = String(value || '').trim().toLowerCase();
    if (!q || !cachedNames || cachedNames.length === 0) {
      suggestionsBox.style.display = 'none';
      suggestionsBox.innerHTML = '';
      return;
    }

    // filter for names that start with the query (fast, local)
    const matches = [];
    // small optimization: stop after 8 matches
    for (let i = 0, len = cachedNames.length; i < len && matches.length < 8; i++) {
      const n = cachedNames[i];
      if (n.startsWith(q)) matches.push(n);
    }

    if (matches.length === 0) {
      suggestionsBox.style.display = 'none';
      suggestionsBox.innerHTML = '';
      return;
    }

    // build suggestion items
    suggestionsBox.innerHTML = '';
    matches.forEach((name) => {
      const item = document.createElement('div');
      item.textContent = name;
      item.setAttribute('role', 'option');
      item.style.padding = '6px 10px';
      item.style.cursor = 'pointer';
      item.style.whiteSpace = 'nowrap';
      item.style.textTransform = 'none';
      item.addEventListener('mousedown', (ev) => {
        // use mousedown to avoid blur before click
        ev.preventDefault();
        nameInput.value = name;
        // hide suggestions immediately
        suggestionsBox.style.display = 'none';
        suggestionsBox.innerHTML = '';
        // when user selects, proceed to check immediately (bypass debounce)
        if (debounceTimer) {
          clearTimeout(debounceTimer);
          debounceTimer = null;
        }
        // trigger the same behavior as input: allow types to be locked/unlocked
        pokemonExists = false;
        // run check
        checkPokemon(name);
      });
      item.addEventListener('mouseover', () => {
        item.style.background = '#f5f5f5';
      });
      item.addEventListener('mouseout', () => {
        item.style.background = '';
      });
      suggestionsBox.appendChild(item);
    });

    // position suggestions box under the input (recompute width/position in case of layout changes)
    const rect = nameInput.getBoundingClientRect();
    suggestionsBox.style.minWidth = rect.width + 'px';
    suggestionsBox.style.left = rect.left + window.scrollX + 'px';
    suggestionsBox.style.top = rect.bottom + window.scrollY + 'px';
    suggestionsBox.style.display = '';
  }

  // debounce wrapper
  function scheduleCheck() {
    // clear previous timer
    if (debounceTimer) clearTimeout(debounceTimer);

    // if name empty, cancel check immediately
    if (nameInput.value.trim() === '') {
      pokemonExists = false;
      checking = false;
      showSpinner(false);
      // keep types editable when name is empty
      updateSubmitState();
      // hide suggestions
      suggestionsBox.style.display = 'none';
      return;
    }

    // set checking state and show spinner immediately so user sees feedback
    checking = true;
    showSpinner(true);
    
    updateSubmitState();

    // schedule both suggestion display and the API existence check after debounce
    debounceTimer = setTimeout(() => {
      // ensure names are loaded (fire-and-forget)
      loadAllPokemonNames().then(() => {
        showSuggestionsFor(nameInput.value);
      }).catch(() => {
        // ignore
      });

      checkPokemon(nameInput.value);
      debounceTimer = null;
    }, DEBOUNCE_MS);
  }

  // attach events
  nameInput.addEventListener('input', () => {
    // whenever name changes, we must re-validate
    pokemonExists = false;

   

    // start loading names early (non-blocking)
    loadAllPokemonNames();

    scheduleCheck();
  });

  // hide suggestions when input loses focus, but allow clicks on suggestions (use timeout)
  nameInput.addEventListener('blur', () => {
    setTimeout(() => {
      suggestionsBox.style.display = 'none';
      suggestionsBox.innerHTML = '';
    }, 150);
  });

  // reposition suggestions on window resize/scroll to keep it aligned
  window.addEventListener('resize', () => {
    if (suggestionsBox.style.display !== 'none') {
      const rect = nameInput.getBoundingClientRect();
      suggestionsBox.style.left = rect.left + window.scrollX + 'px';
      suggestionsBox.style.top = rect.bottom + window.scrollY + 'px';
      suggestionsBox.style.minWidth = rect.width + 'px';
    }
  });
  window.addEventListener('scroll', () => {
    if (suggestionsBox.style.display !== 'none') {
      const rect = nameInput.getBoundingClientRect();
      suggestionsBox.style.left = rect.left + window.scrollX + 'px';
      suggestionsBox.style.top = rect.bottom + window.scrollY + 'px';
    }
  }, true);

// Utility: map generation name to numeric generation for comparison
const generationMap = {
  'generation-i': 1,
  'generation-ii': 2,
  'generation-iii': 3,
  'generation-iv': 4,
  'generation-v': 5,
  'generation-vi': 6,
  'generation-vii': 7,
  'generation-viii': 8,
  'generation-ix': 9
};

// Render feedback boxes given the generatedPokemon (the target) and guessedPokemon (the user's guess)
async function renderGuessFeedback(generatedPokemon, guessedPokemon) {
  const result = document.getElementById('guessResult');
  const spriteImg = document.getElementById('pokeSprite');
  const boxes = document.getElementById('infoBoxes');

  // show container
  result.style.display = '';

  // sprite: prefer official artwork then front_default
  const spriteUrl = (guessedPokemon.sprites && (guessedPokemon.sprites.other?.['official-artwork']?.front_default || guessedPokemon.sprites.front_default)) || '';
  spriteImg.src = spriteUrl;
  spriteImg.alt = guessedPokemon.name ? `Sprite of ${guessedPokemon.name}` : 'Pokémon sprite';

  // helper to create a box
  function makeBox(label, value, opts = {}) {
    const div = document.createElement('div');
    div.className = 'info-box outlined';
    if (opts.first) {
      div.classList.remove('outlined');
      div.classList.add('first');
    }
    if (opts.match === true) div.classList.add('match-true');
    if (opts.match === false) div.classList.add('match-false');

    const lab = document.createElement('div');
    lab.className = 'label';
    lab.textContent = label;

    const val = document.createElement('div');
    val.className = 'value';
    val.innerHTML = value;

    div.appendChild(lab);
    div.appendChild(val);
    return div;
  }

  // clear previous
  boxes.innerHTML = '';

  // 1) Sprite label box (first, no outline)
  const firstBox = makeBox('Sprite', '', { first: true });
  boxes.appendChild(firstBox);

  // 2) Generation box
  const genA = generatedPokemon.generation || '';
  const genB = guessedPokemon.generation || '';
  const genANum = generationMap[genA] || null;
  const genBNum = generationMap[genB] || null;

  let genMatch = false;
  let genContent = genB ? `Gen ${genBNum || genB.replace('generation-', '')}` : 'Unknown';
  if (genANum && genBNum) {
    genMatch = genANum === genBNum;
    if (!genMatch) {
      const arrow = genANum > genBNum ? '→' : '←';
      const direction = genANum > genBNum ? 'after' : 'before';
      genContent = `${genContent} <span class="gen-arrow" aria-hidden="true">${arrow}</span>`;
    }
  }
  boxes.appendChild(makeBox('Generation', genContent, { match: genMatch }));

  // 3) Type 1 and Type 2 boxes
  const genTypes = generatedPokemon.types || [];
  const guessTypes = guessedPokemon.types || [];

  const genType1 = genTypes[0] || '';
  const genType2 = genTypes[1] || '';
  const guessType1 = guessTypes[0] || '';
  const guessType2 = guessTypes[1] || '';

  // Type 1 match logic: green if guess type1 equals generated type1
  const type1Match = guessType1 && genType1 && guessType1.toLowerCase() === genType1.toLowerCase();
  boxes.appendChild(makeBox('Type 1', guessType1 || '—', { match: !!type1Match }));

  // Type 2 match logic: green if guess type2 equals generated type2; red if guess has type2 but doesn't match
  let type2Match = null;
  if (!guessType2) {
    type2Match = null;
  } else {
    type2Match = genType2 && guessType2.toLowerCase() === genType2.toLowerCase();
  }
  boxes.appendChild(makeBox('Type 2', guessType2 || '—', { match: type2Match }));

  // 4) Ability
  const guessAbility = (guessedPokemon.abilities && guessedPokemon.abilities[0] && guessedPokemon.abilities[0].name) || '—';
  boxes.appendChild(makeBox('Ability', guessAbility));

  // 5) Height and Weight
  const height = guessedPokemon.height != null ? guessedPokemon.height : '—';
  const weight = guessedPokemon.weight != null ? guessedPokemon.weight : '—';
  boxes.appendChild(makeBox('Height', String(height)));
  boxes.appendChild(makeBox('Weight', String(weight)));

  // ensure focus remains sensible for screen readers
  boxes.setAttribute('tabindex', '-1');
  boxes.focus();
}

// Helper: fetch full pokemon data by id from server or PokeAPI
async function fetchPokemonById(id) {
  try {
    // prefer server endpoint if available
    const resp = await fetch(`/pokemon/${id}`);
    if (resp.ok) return await resp.json();
  } catch (e) {
    // fallback to PokeAPI
  }
  const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
  if (!res.ok) throw new Error('Failed to fetch pokemon');
  return await res.json();
}
