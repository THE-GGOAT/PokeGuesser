{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
 <img src="/random/chart" alt = "bargraph">


    
     <style>
      /* small layout nicety */
      .page-container { padding: 2rem; max-width: 720px; margin: 0 auto; }
      .spinner-inline { width: 1rem; height: 1rem; vertical-align: text-bottom; margin-left: .5rem; }

     
      

      /* the custom box that appears next to the label text */
      .option-box {
        display: inline-block;
        width: 1.25rem;
        height: 1.25rem;
        border: 2px solid #cbd5e1; /* soft gray */
        border-radius: 6px;
        background: white;
        box-sizing: border-box;
        position: relative;
        transition: border-color .12s ease, background-color .12s ease, box-shadow .12s ease;
      }

    

      /* checkmark (white) shown when checked */
      .option-box::after {
        content: "";
        position: absolute;
        left: 6px;
        top: 2px;
        width: 6px;
        height: 10px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
        opacity: 0;
        transition: opacity .12s ease;
      }


    </style>
  
 
    <h1>PokeGuesser</h1>

    <form id="itemForm" method="post" novalidate>
      <div class="mb-3">
        <label class="form-label" for="name">Submit guess</label>
        <div class="input-group">
          <input id="name" name="name" type="text" class="form-control" placeholder="Name" required autocomplete="off">
          <span id="nameSpinner" class="input-group-text bg-white border-start-0" style="display:none;">
            <div class="spinner-border spinner-border-sm spinner-inline" role="status" aria-hidden="true"></div>
          </span>
        </div>
      </div>

     <!-- Insert this below the name input group inside the form -->
<div id="guessResult" class="d-flex align-items-start mt-3" style="display:none;">
  <div id="spriteBox" class="me-3">
    <img id="pokeSprite" src="" alt="" />
  </div>
  <div id="infoBoxes" class="d-flex flex-wrap gap-2" role="list" aria-label="Guess feedback">
    <!-- Boxes will be injected here by JS -->
  </div>
</div>

<style>
  /* Sprite box */
  #spriteBox {
    width: 96px;
    height: 96px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
  }
  #spriteBox img {
    max-width:100%;
    max-height:100%;
    display:block;
  }

  /* Info boxes container */
  #infoBoxes {
    flex:1;
    display:flex;
    gap:8px;
    align-items:stretch;
    flex-wrap:nowrap;
    overflow:auto;
  }

  /* Each info box */
  .info-box {
    min-width:120px;
    height:96px;
    padding:8px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    background:#fff;
    border-radius:6px;
    text-transform:none;
  }

  /* First box (sprite label) has no outline */
  .info-box.first {
    border:0;
    box-shadow:none;
  }

  /* Other boxes have thin black outline */
  .info-box.outlined {
    border:1px solid #000;
  }

  .info-box .label {
    font-size:12px;
    color:#333;
    margin-bottom:6px;
    font-weight:600;
  }

  .info-box .value {
    font-size:16px;
    color:#111;
    font-weight:700;
  }

  /* Color states for type/gen match */
  .match-true { background:#d4f7d4; } /* greenish */
  .match-false { background:#f7d4d4; } /* reddish */

  /* Generation arrow */
  .gen-arrow {
    font-size:18px;
    margin-left:6px;
    opacity:0.9;
  }

  /* Make horizontal scroll visible on small screens */
  #infoBoxes::-webkit-scrollbar { height:8px; }
  #infoBoxes::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius:4px; }
</style>

      <div class="mb-3">
        <button id="submitBtn" type="submit" class="btn btn-primary" disabled>Submit Guess</button>
      </div>

      <div id="formMessages" aria-live="polite"></div>
    </form>
  <script type="module" src="/static/js/main.js"></script>

{% endblock %}
